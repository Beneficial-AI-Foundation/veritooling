# Lint, format-check, and test the standalone Python under tools/ and actions/.
# Runtime is stdlib-only; ruff and pytest are CI-only dev tools.

name: Python Tools

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "actions/**"
      - "pyproject.toml"
      - ".github/workflows/python-tools.yml"
  pull_request:
    paths:
      - "tools/**"
      - "actions/**"
      - "pyproject.toml"
      - ".github/workflows/python-tools.yml"

jobs:
  check:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev tools
        run: pip install ruff pytest

      - name: Format check
        run: ruff format --check tools/ actions/

      - name: Lint
        run: ruff check tools/ actions/

      - name: Test
        run: pytest -q
